name: Cobrinha das contribuições

on:
  push:
    branches: [main]
    paths: ['.github/workflows/snake.yml']
  workflow_dispatch:
  schedule:
    - cron: '17 12 * * *'

permissions:
  contents: write

concurrency:
  group: contribution-snake

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Gerar a animação
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg
            dist/snake-dark.svg?palette=github-dark

      - name: Publicar os SVGs
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: output
          publish_dir: dist
          keep_files: true
