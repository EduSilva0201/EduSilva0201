<svg xmlns="http://www.w3.org/2000/svg" width="760" height="64" viewBox="0 0 760 64" role="img" aria-labelledby="title">
<title id="title">Terminal animado com comandos de logs e Git</title>
<rect width="760" height="64" rx="7" fill="#06120a"/>
<g fill="#39ff6a" font-family="monospace" font-size="24">
  <text x="28" y="41">&gt;</text>
  <clipPath id="line-0"><rect x="57" width="575" height="64"><animate attributeName="width" values="0;575;575" keyTimes="0;0.13;1" calcMode="linear" dur="12s" repeatCount="indefinite"/></rect></clipPath>
  <text x="57" y="41" opacity="1" clip-path="url(#line-0)">tail -f logs/app.log<animate attributeName="opacity" values="1;0;0" keyTimes="0;0.333333;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/></text>
  <clipPath id="line-1"><rect x="57" width="575" height="64"><animate attributeName="width" values="0;0;575;575" keyTimes="0;0.333333;0.463333;1" calcMode="linear" dur="12s" repeatCount="indefinite"/></rect></clipPath>
  <text x="57" y="41" opacity="0" clip-path="url(#line-1)">git status<animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.333333;0.666667;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/></text>
  <clipPath id="line-2"><rect x="57" width="575" height="64"><animate attributeName="width" values="0;0;575;575" keyTimes="0;0.666667;0.796667;1" calcMode="linear" dur="12s" repeatCount="indefinite"/></rect></clipPath>
  <text x="57" y="41" opacity="0" clip-path="url(#line-2)">git commit -m &quot;corrige bug&quot;<animate attributeName="opacity" values="0;1;0" keyTimes="0;0.666667;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/></text>
</g>
</svg>
